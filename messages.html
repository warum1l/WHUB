<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Messages — WHUB</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="toast.css" />
  <link rel="stylesheet" href="auth.css" />
  <link rel="stylesheet" href="social.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
</head>
<body>
  <nav class="navbar">
    <a href="index.html" class="logo">W<span>HUB</span></a>
    <div class="nav-right"></div>
  </nav>

  <div class="auth-loading" id="pageLoading"><div class="auth-loading-spinner"></div></div>

  <div id="messagesPage" style="display:none">
    <div class="msg-layout">
      <div class="msg-sidebar">
        <div class="msg-sidebar-header">Messages</div>
        <div class="msg-convo-list" id="convoList">
          <div style="padding:24px;text-align:center;color:var(--text-dim);font-size:0.82rem">Loading...</div>
        </div>
      </div>

      <div class="msg-chat" id="chatPanel">
        <div class="msg-chat-empty" id="chatEmpty">
          <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg>
          <p>Select a conversation</p>
        </div>
        <div id="chatActive" style="display:none;flex-direction:column;height:100%">
          <div class="msg-chat-header">
            <div class="msg-convo-avatar pf-avatar--member" id="chatAvatar">?</div>
            <div><div class="msg-chat-name" id="chatName">—</div></div>
            <a id="chatProfileLink" href="#" style="margin-left:auto;font-size:0.75rem;color:var(--text-dim)">View profile →</a>
          </div>
          <div class="msg-messages" id="msgMessages"></div>
          <div id="msgError" style="padding:0 16px 4px;font-size:0.75rem;color:var(--accent-roblox);min-height:18px"></div>
          <div class="msg-input-wrap">
            <input type="text" class="msg-input" id="msgInput" placeholder="Write a message..." maxlength="500"
              onkeydown="if(event.key==='Enter')sendMessage()" />
            <button class="msg-send-btn" onclick="sendMessage()">Send</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="noAuthPage" style="display:none;text-align:center;padding:160px 20px">
    <h2 style="font-family:var(--font-display);margin-bottom:12px">Sign in to view messages</h2>
    <a href="login.html" style="color:var(--accent-roblox)">Sign In →</a>
  </div>

  <script src="app.js"></script>
  <script type="module" src="nav-auth.js"></script>
  <script type="module" src="messages.js"></script>
</body>
</html>
