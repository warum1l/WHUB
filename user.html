<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile — WHUB</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="toast.css" />
  <link rel="stylesheet" href="auth.css" />
  <link rel="stylesheet" href="social.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
</head>
<body>
  <nav class="navbar">
    <a href="index.html" class="logo">W<span>HUB</span></a>
    <div class="nav-right"></div>
  </nav>

  <div class="auth-loading" id="pageLoading"><div class="auth-loading-spinner"></div></div>

  <div id="notFound" style="display:none;text-align:center;padding:160px 20px 80px">
    <div style="color:var(--text-dim);margin-bottom:16px">
      <svg xmlns="http://www.w3.org/2000/svg" width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    </div>
    <h2 style="font-family:var(--font-display);font-size:1.8rem;margin-bottom:10px">User not found</h2>
    <a href="index.html" style="color:var(--accent-roblox)">← Back to Home</a>
  </div>

  <div id="profilePage" style="display:none">

    <div class="pf-cover-wrap">
      <div class="pf-cover" id="pfCover"></div>
      <div class="pf-cover-bottom">
        <div class="pf-avatar-outer"><div class="pf-avatar" id="pubAvatar">W</div></div>
        <div class="pf-cover-actions" id="pubActions"></div>
      </div>
    </div>

    <div class="pf-body">
      <aside class="pf-sidebar">

        <div class="pf-card pf-identity">
          <div class="pf-username-row">
            <h1 class="pf-username" id="pubUsername">—</h1>
            <span class="profile-role-badge" id="pubRole">Member</span>
          </div>
          <p class="pf-bio" id="pubBio"></p>
          <div class="pf-meta-list">
            <div class="pf-meta-item" id="pfRobloxWrap" style="display:none">
              <svg viewBox="0 0 20 20" fill="none" width="13" height="13"><rect x="3" y="3" width="6" height="6" rx="1" fill="currentColor"/><rect x="11" y="3" width="6" height="6" rx="1" fill="currentColor" opacity=".5"/><rect x="3" y="11" width="6" height="6" rx="1" fill="currentColor" opacity=".5"/><rect x="11" y="11" width="6" height="6" rx="1" fill="currentColor"/></svg>
              <span id="pfRobloxVal" class="pf-social--roblox">—</span>
            </div>
            <div class="pf-meta-item" id="pfDiscordWrap" style="display:none">
              <svg viewBox="0 0 20 20" fill="currentColor" width="13" height="13"><path d="M16.9 4.2A16.1 16.1 0 0 0 13 3a.1.1 0 0 0-.1.1 11 11 0 0 0-.5 1 14.9 14.9 0 0 0-4.8 0 10.5 10.5 0 0 0-.5-1 .1.1 0 0 0-.1-.1A16.1 16.1 0 0 0 3.1 4.2a.1.1 0 0 0-.1.1C1.6 8.3 1.2 12.3 1.5 16.3a.1.1 0 0 0 .1.1 16.2 16.2 0 0 0 4.9 2.5.1.1 0 0 0 .1-.1 11.6 11.6 0 0 0 1-1.6.1.1 0 0 0-.1-.2 10.7 10.7 0 0 1-1.5-.7.1.1 0 0 1 0-.2l.3-.2a.1.1 0 0 1 .1 0c3.2 1.5 6.7 1.5 9.9 0a.1.1 0 0 1 .1 0l.3.2a.1.1 0 0 1 0 .2 10 10 0 0 1-1.5.7.1.1 0 0 0-.1.2 13 13 0 0 0 1 1.6.1.1 0 0 0 .1.1 16.2 16.2 0 0 0 4.9-2.5.1.1 0 0 0 .1-.1c.4-4.5-.6-8.5-2.5-12a.1.1 0 0 0-.1-.1Z"/></svg>
              <span id="pfDiscordVal" class="pf-social--discord">—</span>
            </div>
          </div>
        </div>

        <div class="pf-card pf-stats-card">
          <div class="pf-stats-label">Stats</div>
          <div class="pf-stats-grid">
            <div class="pf-stat"><span class="pf-stat-val" id="statPosts">—</span><span class="pf-stat-lbl">Posts</span></div>
            <div class="pf-stat"><span class="pf-stat-val" id="statFriends">—</span><span class="pf-stat-lbl">Friends</span></div>
            <div class="pf-stat"><span class="pf-stat-val" id="statJoinedShort">—</span><span class="pf-stat-lbl">Since</span></div>
          </div>
        </div>

      </aside>

      <main class="pf-main">
        <div class="pf-tabs">
          <button class="pf-tab active" onclick="switchTab('Posts', this)">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            Posts
            <span class="pf-tab-count" id="tabCountPosts">—</span>
          </button>
        </div>
        <div id="tabPosts" class="pf-tab-content">
          <div id="postsFeed">
            <div class="skeleton-card"><div class="skeleton-row"><div class="skeleton skeleton-avatar"></div><div style="flex:1;display:flex;flex-direction:column;gap:6px"><div class="skeleton skeleton-line skeleton-line--sm"></div></div></div><div class="skeleton skeleton-line skeleton-line--lg"></div><div class="skeleton skeleton-line skeleton-line--md"></div></div>
            <div class="skeleton-card"><div class="skeleton-row"><div class="skeleton skeleton-avatar"></div><div style="flex:1;display:flex;flex-direction:column;gap:6px"><div class="skeleton skeleton-line skeleton-line--sm"></div></div></div><div class="skeleton skeleton-line skeleton-line--full"></div></div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <footer class="footer">
    <div class="footer-logo">W<span>HUB</span></div>
    <p class="footer-text">Built for the community, by the community.</p>
  </footer>

  <script src="app.js"></script>
  <script type="module" src="nav-auth.js"></script>
  <script>
    function switchTab(name, btn) {
      document.querySelectorAll('.pf-tab').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.pf-tab-content').forEach(c => c.style.display = 'none');
      btn.classList.add('active');
      document.getElementById('tab' + name).style.display = 'block';
    }
  </script>
  <script type="module" src="user.js"></script>
</body>
</html>
