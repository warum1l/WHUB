<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="apple-touch-icon" href="favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile — WHUB</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="auth.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
</head>
<body>
  <nav class="navbar">
    <a href="index.html" class="logo">W<span>HUB</span></a>
    <div class="nav-right">
      
    </div>
  </nav>

  <div class="page-wrapper" id="profilePage" style="display:none">

    <!-- PROFILE HERO -->
    <div class="profile-hero">
      <div class="profile-hero-bg"></div>
      <div class="profile-hero-inner">

        <div class="profile-avatar-wrap">
          <div class="profile-avatar" id="profileAvatar">W</div>
          <div class="profile-avatar-ring"></div>
        </div>

        <div class="profile-info">
          <div class="profile-role-badge" id="profileRole">Member</div>
          <h1 class="profile-username" id="profileUsername">—</h1>
          <p class="profile-email" id="profileEmail">—</p>
          <p class="profile-bio" id="profileBio"></p>

          <!-- Social links display -->
          <div class="profile-socials" id="profileSocials"></div>

          <p class="profile-joined" id="profileJoined"></p>
          <a class="profile-public-link" id="profilePublicLink" href="#" target="_blank"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg> Public profile</a>
        </div>

        <div class="profile-actions">
          <button class="profile-edit-btn" onclick="openEdit()"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg> Edit Profile</button>
          <button class="profile-signout-btn" onclick="handleSignOut()">Sign Out</button>
        </div>

      </div>
    </div>

    <!-- STATS ROW -->
    <div class="profile-stats-row" id="profileStatsRow">
      <div class="profile-stat-card">
        <span class="pstat-val" id="statTrades">—</span>
        <span class="pstat-label">Trades Posted</span>
      </div>
      <div class="profile-stat-card">
        <span class="pstat-val" id="statFeedback">—</span>
        <span class="pstat-label">Feedback Posts</span>
      </div>
      <div class="profile-stat-card">
        <span class="pstat-val" id="statJoinedShort">—</span>
        <span class="pstat-label">Member Since</span>
      </div>
      <div class="profile-stat-card">
        <span class="pstat-val pstat-val--role" id="statRole">—</span>
        <span class="pstat-label">Role</span>
      </div>
    </div>

    <!-- EDIT PANEL -->
    <div class="profile-edit-panel" id="editPanel">
      <div class="profile-section-label">// EDIT PROFILE</div>
      <div class="profile-edit-grid">

        <div class="auth-field">
          <label class="auth-label">Username</label>
          <input type="text" class="auth-input" id="editUsername" maxlength="24" />
        </div>

        <div class="auth-field">
          <label class="auth-label">Bio</label>
          <input type="text" class="auth-input" id="editBio" placeholder="Something about yourself..." maxlength="120" />
        </div>

        <div class="auth-field">
          <label class="auth-label">Roblox Username</label>
          <input type="text" class="auth-input" id="editRoblox" placeholder="Your Roblox username" maxlength="20" />
        </div>

        <div class="auth-field">
          <label class="auth-label">Discord Tag</label>
          <input type="text" class="auth-input" id="editDiscord" placeholder="username or user#0000" maxlength="40" />
        </div>

      </div>
      <div class="profile-edit-footer">
        <div class="auth-error" id="editError"></div>
        <div class="profile-edit-btns">
          <button class="profile-cancel-btn" onclick="closeEdit()">Cancel</button>
          <button class="auth-btn profile-save-btn" id="saveBtn" onclick="handleSave()">
            <span class="auth-btn-text">Save Changes</span>
          </button>
        </div>
      </div>
    </div>

    <!-- MY TRADES -->
    <div class="profile-section">
      <div class="profile-section-label">// MY TRADES</div>
      <div id="myTradesList" class="profile-activity-list">
        <div class="profile-activity-loading">
          <div class="auth-loading-spinner"></div>
        </div>
      </div>
    </div>

    <!-- MY FEEDBACK -->
    <div class="profile-section">
      <div class="profile-section-label">// MY FEEDBACK POSTS</div>
      <div id="myFeedbackList" class="profile-activity-list">
        <div class="profile-activity-loading">
          <div class="auth-loading-spinner"></div>
        </div>
      </div>
    </div>

    <!-- SEARCH USERS -->
    <div class="profile-section">
      <div class="profile-section-label">// FIND USERS</div>
      <div class="user-search-wrap">
        <div class="user-search-input-wrap">
          <span class="user-search-icon"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg></span>
          <input
            type="text"
            class="user-search-input"
            id="userSearchInput"
            placeholder="Search by username..."
            maxlength="24"
            autocomplete="off"
          />
          <button class="user-search-btn" id="userSearchBtn" onclick="searchUser()">Search</button>
        </div>
        <div id="userSearchResult"></div>
      </div>
    </div>

  </div>

  <div class="auth-loading" id="authLoading">
    <div class="auth-loading-spinner"></div>
  </div>

  <footer class="footer">
    <div class="footer-logo">W<span>HUB</span></div>
    <p class="footer-text">Built for the community, by the community.</p>
  </footer>

  <script src="app.js"></script>
  <script type="module" src="profile.js"></script>
</body>
</html>
