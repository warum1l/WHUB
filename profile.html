<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile — kittens.ez</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="toast.css" />
  <link rel="stylesheet" href="auth.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    .pf-simple-wrap {
      max-width: 480px;
      margin: 0 auto;
      padding: 140px 24px 100px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 20px;
    }
    .pf-simple-avatar {
      width: 84px; height: 84px;
      border-radius: 22px;
      display: flex; align-items: center; justify-content: center;
      font-family: var(--font-display);
      font-weight: 800; font-size: 2rem;
      color: #fff;
      background: linear-gradient(135deg, #2a2d3a, #3a4060);
      box-shadow: var(--shadow-md);
    }
    .pf-simple-username {
      font-family: var(--font-display);
      font-size: 1.4rem; font-weight: 800; color: var(--text);
    }
    .pf-simple-email { font-size: 0.8rem; color: var(--text-dim); }

    .pf-soon-card {
      width: 100%;
      background: var(--bg-card);
      border: 1px dashed var(--border);
      border-radius: var(--radius);
      padding: 32px 24px;
      display: flex; flex-direction: column; align-items: center; gap: 10px;
      margin-top: 8px;
    }
    .pf-soon-icon { color: var(--accent-roblox); opacity: 0.8; }
    .pf-soon-title {
      font-family: var(--font-display);
      font-weight: 800; font-size: 1.1rem; color: var(--text);
    }
    .pf-soon-desc { font-size: 0.85rem; color: var(--text-muted); line-height: 1.6; max-width: 320px; }

    .pf-simple-actions {
      display: flex; gap: 10px; width: 100%; margin-top: 4px;
    }
    .pf-simple-btn {
      flex: 1;
      padding: 11px;
      border-radius: 10px;
      font-family: var(--font-display); font-weight: 700; font-size: 0.85rem;
      text-decoration: none; text-align: center; cursor: pointer;
      transition: all 0.18s; border: 1px solid;
    }
    .pf-simple-btn--anime {
      background: rgba(236,72,153,0.1);
      border-color: rgba(236,72,153,0.3);
      color: #ec4899;
    }
    .pf-simple-btn--anime:hover { background: rgba(236,72,153,0.18); }
    .pf-simple-btn--signout {
      background: var(--bg-card);
      border-color: var(--border);
      color: var(--text-muted);
    }
    .pf-simple-btn--signout:hover { border-color: rgba(232,69,60,0.4); color: var(--accent-roblox); }
  </style>
</head>
<body>
  <nav class="navbar">
    <a href="index.html" class="logo">kittens<span>.ez</span></a>
    <div class="nav-right"></div>
  </nav>

  <div class="auth-loading" id="authLoading"><div class="auth-loading-spinner"></div></div>

  <div id="profilePage" style="display:none">
    <div class="pf-simple-wrap">

      <div class="pf-simple-avatar" id="profileAvatar">?</div>
      <div>
        <div class="pf-simple-username" id="profileUsername">—</div>
        <div class="pf-simple-email" id="profileEmail"></div>
      </div>

      <div class="pf-soon-card">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="pf-soon-icon"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
        <div class="pf-soon-title">Coming Soon</div>
        <div class="pf-soon-desc">Profile features are being rebuilt. For now, your account is used to save and share your Anime List.</div>
      </div>

      <div class="pf-simple-actions">
        <a href="anime.html" class="pf-simple-btn pf-simple-btn--anime">My Anime List</a>
        <button class="pf-simple-btn pf-simple-btn--signout" onclick="handleSignOut()">Sign Out</button>
      </div>

    </div>
  </div>

  <footer class="footer">
    <div class="footer-logo">kittens<span>.ez</span></div>
    <p class="footer-text">Built by one person, for anyone who finds it useful.</p>
  </footer>

  <script src="app.js"></script>
  <script type="module" src="profile.js"></script>
</body>
</html>
