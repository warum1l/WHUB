<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — kittens.ez</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="toast.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    .nf { min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:40px 20px; gap:16px; }
    .nf-code { font-family:var(--font-display); font-size:8rem; font-weight:800; color:var(--accent-roblox); line-height:1; opacity:.12; letter-spacing:-.04em; }
    .nf-title { font-family:var(--font-display); font-size:2rem; font-weight:800; margin-top:-56px; }
    .nf-sub { font-size:.9rem; color:var(--text-muted); max-width:360px; line-height:1.6; }
    .nf-links { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin-top:8px; }
    .nf-btn { padding:10px 24px; border-radius:10px; font-family:var(--font-display); font-weight:700; font-size:.85rem; text-decoration:none; transition:all .18s; }
    .nf-btn--p { background:var(--accent-roblox); color:#fff; }
    .nf-btn--p:hover { background:#c93b33; }
    .nf-btn--g { background:var(--bg-card); border:1px solid var(--border); color:var(--text); }
    .nf-btn--g:hover { border-color:var(--border-hover); }
  </style>
</head>
<body>
  <nav class="navbar"><a href="index.html" class="logo">kittens<span>.ez</span></a><div class="nav-right"></div></nav>
  <div class="nf">
    <div class="nf-code">404</div>
    <h1 class="nf-title">Page not found</h1>
    <p class="nf-sub">The page you're looking for doesn't exist or was moved.</p>
    <div class="nf-links">
      <a href="index.html" class="nf-btn nf-btn--p">← Back to Home</a>
      <a href="feedback.html" class="nf-btn nf-btn--g">Report issue</a>
    </div>
  </div>
  <script src="app.js"></script>
  <script type="module" src="nav-auth.js"></script>
</body>
</html>
