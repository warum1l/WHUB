<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Panel — WHUB</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="auth.css" />
  <link rel="stylesheet" href="aotr-trading.css" />
  <link rel="stylesheet" href="admin.css" />
  <link rel="stylesheet" href="feedback.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
</head>
<body>
  <nav class="navbar">
    <a href="index.html" class="logo">W<span>HUB</span></a>
    <div class="nav-right">
    </div>
  </nav>

  <!-- LOADING / ACCESS DENIED -->
  <div class="auth-loading" id="pageLoading">
    <div class="auth-loading-spinner"></div>
  </div>
  <div class="admin-denied" id="accessDenied" style="display:none">
    <div class="admin-denied-inner">
      <span><svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>
      <h2>Access Denied</h2>
      <p>You don't have permission to view this page.</p>
      <a href="index.html">← Back to Home</a>
    </div>
  </div>

  <!-- ADMIN PANEL -->
  <div class="page-wrapper" id="adminPage" style="display:none">

    <div class="admin-header">
      <div>
        <div class="profile-section-label">// ADMIN PANEL</div>
        <h1 class="admin-title">Dashboard</h1>
      </div>
      <div class="admin-stats" id="adminStats"></div>
    </div>

    <!-- TABS -->
    <div class="admin-tabs">
      <button class="admin-tab active" onclick="switchTab(this,'users')"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 1-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg> Users</button>
      <button class="admin-tab" onclick="switchTab(this,'trades')"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m2 9 3-3 3 3"/><path d="M13 18H7a2 2 0 0 1-2-2V6"/><path d="m22 15-3 3-3-3"/><path d="M11 6h6a2 2 0 0 1 2 2v10"/></svg> Trades</button>
      <button class="admin-tab" onclick="switchTab(this,'feedback')"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg> Feedback</button>
    </div>

    <!-- USERS TAB -->
    <div class="admin-tab-content" id="tab-users">
      <div class="admin-search-bar">
        <input type="text" class="auth-input admin-search" id="userSearch"
          placeholder="Search by username or email..."
          oninput="filterUsers()" />
      </div>
      <div class="admin-table-wrap">
        <table class="admin-table" id="usersTable">
          <thead>
            <tr>
              <th>User</th>
              <th>Email</th>
              <th>Role</th>
              <th>Joined</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="usersBody">
            <tr><td colspan="5" class="admin-loading-cell"><div class="auth-loading-spinner"></div></td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- TRADES TAB -->
    <div class="admin-tab-content hidden" id="tab-trades">
      <div class="admin-table-wrap">
        <table class="admin-table" id="tradesTable">
          <thead>
            <tr>
              <th>User</th>
              <th>Offering</th>
              <th>Wants</th>
              <th>Status</th>
              <th>Posted</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="tradesBody">
            <tr><td colspan="6" class="admin-loading-cell"><div class="auth-loading-spinner"></div></td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- FEEDBACK TAB -->
    <div class="admin-tab-content hidden" id="tab-feedback">
      <div class="admin-table-wrap">
        <table class="admin-table">
          <thead>
            <tr>
              <th>Type</th>
              <th>Title</th>
              <th>User</th>
              <th>▲</th>
              <th>Posted</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="feedbackBody">
            <tr><td colspan="6" class="admin-loading-cell"><div class="auth-loading-spinner"></div></td></tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <!-- ROLE MODAL -->
  <div class="modal-overlay" id="roleOverlay" onclick="closeRoleModal()"></div>
  <div class="modal" id="roleModal">
    <div class="modal-header">
      <h2 class="modal-title">Change Role</h2>
      <button class="modal-close" onclick="closeRoleModal()">✕</button>
    </div>
    <div class="modal-body">
      <p class="admin-role-user" id="roleModalUser"></p>
      <div class="admin-role-options">
        <button class="admin-role-opt" data-role="member"    onclick="applyRole('member')"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg> Member</button>
        <button class="admin-role-opt" data-role="mod"       onclick="applyRole('mod')"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/></svg> Moderator</button>
        <button class="admin-role-opt" data-role="admin"     onclick="applyRole('admin')"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg> Admin</button>
      </div>
      <div class="auth-error" id="roleError"></div>
    </div>
  </div>

  <footer class="footer">
    <div class="footer-logo">W<span>HUB</span></div>
    <p class="footer-text">Built for the community, by the community.</p>
  </footer>

  <script src="app.js"></script>
  <script type="module" src="admin.js"></script>
</body>
</html>
