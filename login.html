<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — WHUB</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="auth.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
</head>
<body>
  <nav class="navbar">
    <a href="index.html" class="logo">W<span>HUB</span></a>
    <div class="nav-right">
      
    </div>
  </nav>

  <div class="auth-page">
    <div class="auth-bg"></div>

    <div class="auth-card">
      <!-- Logo -->
      <div class="auth-logo">
        <div class="auth-avatar-w">W</div>
        <span class="auth-logo-text">W<span>HUB</span></span>
      </div>

      <!-- Tabs -->
      <div class="auth-tabs">
        <button class="auth-tab active" id="tabLogin" onclick="switchTab('login')">Sign In</button>
        <button class="auth-tab" id="tabRegister" onclick="switchTab('register')">Register</button>
      </div>

      <!-- Sign In Form -->
      <div class="auth-form" id="formLogin">
        <div class="auth-field">
          <label class="auth-label">Email</label>
          <input type="email" class="auth-input" id="loginEmail" placeholder="your@email.com" />
        </div>
        <div class="auth-field">
          <label class="auth-label">Password</label>
          <input type="password" class="auth-input" id="loginPassword" placeholder="••••••••" />
        </div>
        <div class="auth-error" id="loginError"></div>
        <button class="auth-btn" id="loginBtn" onclick="handleLogin()">
          <span class="auth-btn-text">Sign In</span>
        </button>
      </div>

      <!-- Register Form -->
      <div class="auth-form hidden" id="formRegister">
        <div class="auth-field">
          <label class="auth-label">Username</label>
          <input type="text" class="auth-input" id="regUsername" placeholder="coolname" maxlength="24" />
        </div>
        <div class="auth-field">
          <label class="auth-label">Email</label>
          <input type="email" class="auth-input" id="regEmail" placeholder="your@email.com" />
        </div>
        <div class="auth-field">
          <label class="auth-label">Password</label>
          <input type="password" class="auth-input" id="regPassword" placeholder="Min. 6 characters" />
        </div>
        <div class="auth-error" id="registerError"></div>
        <button class="auth-btn" id="registerBtn" onclick="handleRegister()">
          <span class="auth-btn-text">Create Account</span>
        </button>
      </div>

    </div>
  </div>

  <script src="app.js"></script>
  <script type="module" src="login.js"></script>
</body>
</html>
