<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="apple-touch-icon" href="favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="WHUB community leaderboard — top members by trades and activity." />
  <meta name="robots" content="index, follow" />
  <title>Leaderboard — WHUB</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="auth.css" />
  <link rel="stylesheet" href="leaderboard.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
</head>
<body>
  <nav class="navbar">
    <a href="index.html" class="logo">W<span>HUB</span></a>
    <div class="nav-right">
      
    </div>
  </nav>

  <div class="page-wrapper">
    <div class="page-hero">
      <div class="lb-hero-bg"></div>
      <div class="page-hero-content">
        <div class="breadcrumb">
          <a href="index.html">Home</a>
          <span>›</span>
          <span>Leaderboard</span>
        </div>
        <h1 class="page-title">Community <span class="lb-accent">Leaderboard</span></h1>
        <p class="page-subtitle">Top members ranked by trades posted and community activity.</p>
      </div>
    </div>

    <div class="lb-page">

      <!-- TABS -->
      <div class="lb-tabs">
        <button class="lb-tab active" data-tab="trades" onclick="switchTab('trades')"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m2 9 3-3 3 3"/><path d="M13 18H7a2 2 0 0 1-2-2V6"/><path d="m22 15-3 3-3-3"/><path d="M11 6h6a2 2 0 0 1 2 2v10"/></svg> Most Trades</button>
        <button class="lb-tab" data-tab="feedback" onclick="switchTab('feedback')"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg> Most Posts</button>
        <button class="lb-tab" data-tab="oldest" onclick="switchTab('oldest')"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/></svg> OG Members</button>
      </div>

      <!-- TABLE -->
      <div class="lb-table-wrap">
        <div class="lb-table-header">
          <span class="lb-col lb-col--rank">#</span>
          <span class="lb-col lb-col--user">User</span>
          <span class="lb-col lb-col--stat" id="listStatLabel">Trades</span>
          <span class="lb-col lb-col--joined">Joined</span>
        </div>
        <div id="lbList">
          <div class="lb-loading"><div class="auth-loading-spinner"></div></div>
        </div>
      </div>

    </div>
  </div>

  <footer class="footer">
    <div class="footer-logo">W<span>HUB</span></div>
    <p class="footer-text">Built for the community, by the community.</p>
  </footer>

  <script src="app.js"></script>
  <script type="module" src="nav-auth.js"></script>
  <script type="module" src="leaderboard.js"></script>
</body>
</html>
