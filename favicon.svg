<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#0f1923"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8453c"/>
      <stop offset="100%" style="stop-color:#ff6b42"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- Subtle border -->
  <rect width="64" height="64" rx="14" fill="none" stroke="rgba(232,69,60,0.35)" stroke-width="1.5"/>

  <!-- W letter -->
  <text
    x="32" y="44"
    font-family="Arial Black, sans-serif"
    font-weight="900"
    font-size="36"
    text-anchor="middle"
    fill="url(#accent)"
    letter-spacing="-1"
  >W</text>

  <!-- Small HUB text -->
  <text
    x="32" y="57"
    font-family="Arial, sans-serif"
    font-weight="700"
    font-size="10"
    text-anchor="middle"
    fill="rgba(255,255,255,0.45)"
    letter-spacing="2"
  >HUB</text>
</svg>
